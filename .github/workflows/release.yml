name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-installer:
    if: github.event_name == 'push' && github.event.deleted == false && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - run: python tests/verify_workflow_security.py
      - run: python tests/verify_release_tag.py
      - run: python tests/verify_release_publish_script.py --require-pwsh

      - name: Define version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/validate_release_tag.py "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag de release inválida: $env:RELEASE_TAG"
          }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download verified FFmpeg
        shell: pwsh
        run: ./scripts/Get-FFmpeg.ps1

      - run: dotnet restore Whispers.sln
      - run: dotnet build Whispers.sln -c Release --no-restore
      - run: dotnet run --project tests/Whispers.Checks -c Release --no-build

      - name: Publish application
        shell: pwsh
        run: >-
          dotnet publish src/Whispers/Whispers.csproj -c Release -r win-x64
          --self-contained true -o artifacts/publish
          -p:PublishSingleFile=false -p:DebugType=None -p:Version=$env:APP_VERSION

      - name: Verify published payload
        shell: pwsh
        run: python tests/verify_publish_layout.py artifacts/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer/Whispers.iss

      - name: Verify installer payload
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:LOCALAPPDATA "Whispers-ci-$env:GITHUB_RUN_ID"
          Remove-Item $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $installer = (Resolve-Path "artifacts/installer/Whispers-Setup-x64.exe").Path
            $installProcess = Start-Process -FilePath $installer -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDirectory`""
            ) -Wait -PassThru
            if ($installProcess.ExitCode -ne 0) {
              throw "O instalador retornou o código $($installProcess.ExitCode)."
            }
            python tests/verify_publish_layout.py $installDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "A instalação não contém todas as dependências esperadas."
            }
          }
          finally {
            Remove-Item $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whispers-installer
          path: artifacts/installer/Whispers-Setup-x64.exe
          if-no-files-found: error

  publish-release:
    needs: build-installer
    if: needs.build-installer.result == 'success' && github.event_name == 'push' && github.event.deleted == false && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: whispers-installer
          path: artifacts/installer

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $tagRef = gh api "repos/$env:GH_REPO/git/ref/tags/$encodedTag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível consultar a tag de release."
          }
          $tagObjectSha = $tagRef.object.sha
          if ($tagRef.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GH_REPO/git/tags/$tagObjectSha" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $tagObject.object.type -ne 'commit') {
              throw "A tag de release não aponta para um commit."
            }
            $tagCommitSha = $tagObject.object.sha
          }
          elseif ($tagRef.object.type -eq 'commit') {
            $tagCommitSha = $tagObjectSha
          }
          else {
            throw "Tipo de objeto de tag não suportado: $($tagRef.object.type)"
          }
          if ($tagCommitSha -ne $env:RELEASE_SHA) {
            throw "A tag de release não aponta para o commit validado pelo build."
          }
          gh release create "$env:RELEASE_TAG" artifacts/installer/Whispers-Setup-x64.exe --repo "$env:GH_REPO" --verify-tag --target "$env:RELEASE_SHA" --generate-notes --title "Whispers $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível criar a GitHub Release."
          }
