name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Define version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            "0.0.0-ci.${{ github.run_number }}"
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Download verified FFmpeg
        shell: pwsh
        run: ./scripts/Get-FFmpeg.ps1

      - run: dotnet restore Whispers.sln
      - run: dotnet build Whispers.sln -c Release --no-restore
      - run: dotnet run --project tests/Whispers.Checks -c Release --no-build

      - name: Publish application
        shell: pwsh
        run: >-
          dotnet publish src/Whispers/Whispers.csproj -c Release -r win-x64
          --self-contained true -o artifacts/publish
          -p:PublishSingleFile=false -p:DebugType=None -p:Version=$env:APP_VERSION

      - name: Verify published payload
        shell: pwsh
        run: python tests/verify_publish_layout.py artifacts/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer/Whispers.iss

      - name: Verify installer payload
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:LOCALAPPDATA "Whispers-ci-$env:GITHUB_RUN_ID"
          Remove-Item $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $installer = (Resolve-Path "artifacts/installer/Whispers-Setup-x64.exe").Path
            & $installer "/VERYSILENT" "/SUPPRESSMSGBOXES" "/NORESTART" "/SP-" "/DIR=$installDirectory"
            if ($LASTEXITCODE -ne 0) {
              throw "O instalador retornou o código $LASTEXITCODE."
            }
            python tests/verify_publish_layout.py $installDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "A instalação não contém todas as dependências esperadas."
            }
          }
          finally {
            Remove-Item $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/installer/Whispers-Setup-x64.exe
          --verify-tag --generate-notes --title "Whispers ${{ github.ref_name }}"
