name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Whispers.sln
      - run: dotnet build Whispers.sln -c Release --no-restore
      - run: dotnet run --project tests/Whispers.Checks -c Release --no-build
